[package]
name = "cross-site"
authors = ["LeoniePhiline <awoo@posteo.de>"]
version = "0.3.1"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
axum-csrf-sync-pattern = { path = "../../" }
color-eyre = "0.6.3"
tokio = { version = "1.37.0", features = ["macros", "rt", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tower-sessions = "0.14.0"
tracing-subscriber = "0.3.18"
